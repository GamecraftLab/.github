name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not post links to ROMs, BIOS files, firmware or games, or ask where to get them.** Such issues are deleted.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. v0.1.0 or commit hash
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - Steam Deck (SteamOS)
        - macOS
        - Android
        - iOS
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: text
  - type: checkboxes
    id: rules
    attributes:
      label: Community rules
      options:
        - label: This issue does not contain or ask for ROMs, BIOS files, firmware or games.
          required: true
